<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 830" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <rect width="1100" height="830" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1d2733">Esquema elétrico — Cisterna Inteligente de Água da Chuva</text>
  <text x="40" y="64" font-size="13" fill="#66727f">Arduino Uno · 2 sensores (potenciômetro, botão) · 3 atuadores (servo, LEDs, buzzer) · ligação USB com a Raspberry Pi</text>

  <!-- ===== Barramento GND (topo) ===== -->
  <line x1="120" y1="100" x2="900" y2="100" stroke="#222" stroke-width="3"/>
  <text x="910" y="105" font-size="14" font-weight="700" fill="#222">GND</text>

  <!-- ===== Arduino ===== -->
  <rect x="400" y="330" width="500" height="250" rx="14" fill="#0f7d8c"/>
  <rect x="400" y="330" width="500" height="250" rx="14" fill="none" stroke="#0a5560" stroke-width="2"/>
  <text x="650" y="445" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">ARDUINO UNO</text>
  <rect x="345" y="420" width="70" height="44" rx="4" fill="#b8bec5" stroke="#6b7480"/>
  <text x="380" y="447" font-size="12" font-weight="700" fill="#333" text-anchor="middle">USB</text>
  <!-- header superior -->
  <rect x="425" y="336" width="430" height="22" rx="3" fill="#1b1b1b"/>
  <!-- header inferior -->
  <rect x="490" y="552" width="250" height="22" rx="3" fill="#1b1b1b"/>

  <!-- Pinos superiores -->
  <g font-size="12" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="440" cy="347" r="5" fill="#d4af37"/><text x="440" y="378">GND</text>
    <circle cx="520" cy="347" r="5" fill="#d4af37"/><text x="520" y="378">D9</text>
    <circle cx="570" cy="347" r="5" fill="#d4af37"/><text x="570" y="378">D8</text>
    <circle cx="640" cy="347" r="5" fill="#d4af37"/><text x="640" y="378">D7</text>
    <circle cx="700" cy="347" r="5" fill="#d4af37"/><text x="700" y="378">D6</text>
    <circle cx="760" cy="347" r="5" fill="#d4af37"/><text x="760" y="378">D5</text>
    <circle cx="840" cy="347" r="5" fill="#d4af37"/><text x="840" y="378">D2</text>
  </g>
  <!-- Pinos inferiores -->
  <g font-size="12" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="520" cy="563" r="5" fill="#d4af37"/><text x="520" y="540">5V</text>
    <circle cx="560" cy="563" r="5" fill="#d4af37"/><text x="560" y="540">GND</text>
    <circle cx="700" cy="563" r="5" fill="#d4af37"/><text x="700" y="540">A0</text>
  </g>

  <!-- GND do Arduino ao barramento -->
  <line x1="440" y1="342" x2="440" y2="100" stroke="#222" stroke-width="2.5"/>
  <circle cx="440" cy="100" r="5" fill="#222"/>

  <!-- ===== Servo (D9) ===== -->
  <rect x="120" y="170" width="170" height="80" rx="10" fill="#2b5fa8"/>
  <circle cx="160" cy="210" r="22" fill="#fff" opacity=".9"/>
  <rect x="155" y="186" width="10" height="34" rx="4" fill="#2b5fa8"/>
  <text x="235" y="205" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">SERVO</text>
  <text x="235" y="224" font-size="12" fill="#e6eefa" text-anchor="middle">SG90</text>
  <!-- PWM -->
  <polyline points="520,342 520,230 290,230" fill="none" stroke="#f08c00" stroke-width="2.5"/>
  <text x="300" y="222" font-size="11" fill="#b05f00">sinal (PWM)</text>
  <!-- GND -->
  <polyline points="150,170 150,100" fill="none" stroke="#222" stroke-width="2.5"/>
  <circle cx="150" cy="100" r="5" fill="#222"/>
  <!-- V+ -->
  <polyline points="120,235 95,235 95,760 520,760 520,568" fill="none" stroke="#d62828" stroke-width="2.5"/>
  <text x="101" y="300" font-size="11" fill="#a11d1d">V+ (5V)</text>

  <!-- ===== Buzzer (D8) ===== -->
  <circle cx="570" cy="200" r="28" fill="#2d2d2d"/>
  <circle cx="570" cy="200" r="8" fill="#555"/>
  <text x="532" y="196" font-size="14" font-weight="700" fill="#1d2733" text-anchor="end">BUZZER</text>
  <text x="532" y="213" font-size="11" fill="#66727f" text-anchor="end">aviso</text>
  <line x1="570" y1="228" x2="570" y2="342" stroke="#7b2cbf" stroke-width="2.5"/>
  <text x="575" y="250" font-size="11" fill="#5a1f8f">+</text>
  <line x1="570" y1="172" x2="570" y2="100" stroke="#222" stroke-width="2.5"/>
  <circle cx="570" cy="100" r="5" fill="#222"/>
  <text x="575" y="160" font-size="11" fill="#333">−</text>

  <!-- ===== LEDs + resistores (D7, D6, D5) ===== -->
  <!-- resistores -->
  <g>
    <line x1="640" y1="100" x2="640" y2="130" stroke="#222" stroke-width="2.5"/>
    <rect x="631" y="130" width="18" height="48" rx="4" fill="#e9d7b5" stroke="#8a6d3b"/>
    <rect x="631" y="140" width="18" height="4" fill="#d62828"/><rect x="631" y="150" width="18" height="4" fill="#d62828"/><rect x="631" y="160" width="18" height="4" fill="#6b3e1b"/>
    <line x1="640" y1="178" x2="640" y2="225" stroke="#222" stroke-width="2.5"/>

    <line x1="700" y1="100" x2="700" y2="130" stroke="#222" stroke-width="2.5"/>
    <rect x="691" y="130" width="18" height="48" rx="4" fill="#e9d7b5" stroke="#8a6d3b"/>
    <rect x="691" y="140" width="18" height="4" fill="#d62828"/><rect x="691" y="150" width="18" height="4" fill="#d62828"/><rect x="691" y="160" width="18" height="4" fill="#6b3e1b"/>
    <line x1="700" y1="178" x2="700" y2="225" stroke="#222" stroke-width="2.5"/>

    <line x1="760" y1="100" x2="760" y2="130" stroke="#222" stroke-width="2.5"/>
    <rect x="751" y="130" width="18" height="48" rx="4" fill="#e9d7b5" stroke="#8a6d3b"/>
    <rect x="751" y="140" width="18" height="4" fill="#d62828"/><rect x="751" y="150" width="18" height="4" fill="#d62828"/><rect x="751" y="160" width="18" height="4" fill="#6b3e1b"/>
    <line x1="760" y1="178" x2="760" y2="225" stroke="#222" stroke-width="2.5"/>
    <circle cx="640" cy="100" r="5" fill="#222"/><circle cx="700" cy="100" r="5" fill="#222"/><circle cx="760" cy="100" r="5" fill="#222"/>
    <text x="773" y="158" font-size="11" fill="#66727f">220 ohms</text>
  </g>
  <!-- LEDs (catodo em cima, anodo embaixo) -->
  <g>
    <path d="M626 255 L654 255 L640 230 Z" fill="#d62828"/><line x1="626" y1="230" x2="654" y2="230" stroke="#222" stroke-width="2.5"/>
    <path d="M686 255 L714 255 L700 230 Z" fill="#e0a100"/><line x1="686" y1="230" x2="714" y2="230" stroke="#222" stroke-width="2.5"/>
    <path d="M746 255 L774 255 L760 230 Z" fill="#2e9e5b"/><line x1="746" y1="230" x2="774" y2="230" stroke="#222" stroke-width="2.5"/>
    <line x1="640" y1="255" x2="640" y2="342" stroke="#d62828" stroke-width="2.5"/>
    <line x1="700" y1="255" x2="700" y2="342" stroke="#c48a00" stroke-width="2.5"/>
    <line x1="760" y1="255" x2="760" y2="342" stroke="#2e9e5b" stroke-width="2.5"/>
    <text x="640" y="290" font-size="11" fill="#a11d1d" text-anchor="middle" dx="-26">verm.</text>
    <text x="700" y="290" font-size="11" fill="#8a6200" text-anchor="middle" dx="-24">amar.</text>
    <text x="760" y="290" font-size="11" fill="#1f6b3e" text-anchor="middle" dx="-22">verde</text>
  </g>

  <!-- ===== Botão (D2) ===== -->
  <rect x="815" y="175" width="50" height="50" rx="6" fill="#d9dde2" stroke="#6b7480"/>
  <circle cx="840" cy="200" r="14" fill="#2b5fa8"/>
  <text x="878" y="196" font-size="14" font-weight="700" fill="#1d2733">BOTÃO</text>
  <text x="878" y="213" font-size="11" fill="#66727f">chuva (pull-up interno)</text>
  <line x1="840" y1="225" x2="840" y2="342" stroke="#2b5fa8" stroke-width="2.5"/>
  <line x1="840" y1="175" x2="840" y2="100" stroke="#222" stroke-width="2.5"/>
  <circle cx="840" cy="100" r="5" fill="#222"/>

  <!-- ===== Potenciômetro (A0) ===== -->
  <rect x="560" y="660" width="120" height="56" rx="28" fill="#3a3f46"/>
  <circle cx="620" cy="688" r="18" fill="#9aa3ad"/>
  <line x1="620" y1="688" x2="620" y2="672" stroke="#3a3f46" stroke-width="4"/>
  <text x="540" y="790" font-size="14" font-weight="700" fill="#1d2733">POTENCIÔMETRO 10k</text>
  <text x="540" y="807" font-size="11" fill="#66727f">nível da cisterna (boia)</text>
  <!-- pernas -->
  <line x1="585" y1="660" x2="585" y2="640" stroke="#555" stroke-width="3"/>
  <line x1="620" y1="716" x2="620" y2="736" stroke="#555" stroke-width="3"/>
  <line x1="655" y1="660" x2="655" y2="640" stroke="#555" stroke-width="3"/>
  <!-- VCC: 5V -->
  <polyline points="520,568 520,640 585,640" fill="none" stroke="#d62828" stroke-width="2.5"/>
  <circle cx="520" cy="640" r="5" fill="#d62828"/>
  <!-- GND -->
  <polyline points="560,568 560,610 655,610 655,640" fill="none" stroke="#222" stroke-width="2.5"/>
  <!-- SIG: A0 -->
  <polyline points="620,736 740,736 740,600 700,600 700,568" fill="none" stroke="#f08c00" stroke-width="2.5"/>
  <text x="748" y="680" font-size="11" fill="#b05f00">sinal</text>

  <!-- ===== Raspberry Pi via USB ===== -->
  <line x1="345" y1="442" x2="330" y2="442" stroke="#6b7480" stroke-width="5"/>
  <rect x="140" y="400" width="190" height="84" rx="10" fill="#c51a4a"/>
  <text x="235" y="436" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">RASPBERRY PI</text>
  <text x="235" y="458" font-size="12" fill="#ffe3ea" text-anchor="middle">cabo USB · Serial 9600</text>

  <!-- ===== Legenda ===== -->
  <g font-size="12" fill="#1d2733">
    <text x="760" y="760" font-weight="700">Cores dos fios</text>
    <line x1="760" y1="775" x2="785" y2="775" stroke="#d62828" stroke-width="3"/><text x="792" y="779">5V</text>
    <line x1="830" y1="775" x2="855" y2="775" stroke="#222" stroke-width="3"/><text x="862" y="779">GND</text>
    <line x1="910" y1="775" x2="935" y2="775" stroke="#f08c00" stroke-width="3"/><text x="942" y="779">sinal</text>
    <line x1="760" y1="798" x2="785" y2="798" stroke="#6b7480" stroke-width="5"/><text x="792" y="802">USB</text>
  </g>
</svg>
